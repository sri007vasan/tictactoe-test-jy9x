<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tictactoe-test-jy9x</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #fff; font-family: system-ui; padding: 3rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2rem; }
  </style>
</head>
<body>
  <div class="container max-w-lg">
    <div class="card shadow-lg">
      <h2 class="h4 text-indigo-400 mb-3 font-bold">⚡ tictactoe-test-jy9x</h2>
      <p class="text-slate-300 mb-4">Create a Tic-Tac-Toe game so that one player plays for X and the other player plays for O, make the UI colorful and interactive.</p>
      
      <div id="app-output" class="p-3 bg-dark rounded-3 font-mono text-emerald-400 mb-3">
        Status: Application Loaded & Active
      </div>

      <button className="btn btn-primary" onclick="runAction()">Execute Interactive Feature</button>
    </div>
  </div>

  <script>
    function runAction() {
      const out = document.getElementById('app-output');
      out.textContent = 'Action executed successfully at ' + new Date().toLocaleTimeString();
    }
  </script>
</body>
</html>
